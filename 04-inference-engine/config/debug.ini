# Debug Configuration
# ====================
# Verbose logging and conservative settings for debugging

CUDA_DEVICE=0
MAX_GPU_MEMORY_MB=4096  # Limit memory for debugging

# Conservative settings
ENABLE_TENSOR_CORES=false
ENABLE_ASYNC_COPY=false
NUM_STREAMS=1

# Simple GEMM for debugging
GEMM_PRESET=small
BLOCK_M=64
BLOCK_N=64
BLOCK_K=8
USE_DOUBLE_BUFFER=false
USE_VECTORIZED_LOAD=false

# Verbose logging
LOG_LEVEL=DEBUG
LOG_FILE=debug.log
LOG_COLORS=true

# Quick benchmarks
BENCHMARK_WARMUP_ITERS=2
BENCHMARK_BENCH_ITERS=5

# Disable memory pool for easier debugging
MEMORY_POOL_ENABLED=false
