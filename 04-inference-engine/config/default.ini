# Mini-Inference Engine Configuration
# =====================================

# CUDA Device Settings
CUDA_DEVICE=0
MAX_GPU_MEMORY_MB=0  # 0 = unlimited

# Feature Flags
ENABLE_TENSOR_CORES=true
ENABLE_ASYNC_COPY=true
NUM_STREAMS=4

# GEMM Configuration
# Presets: small, medium, large, volta, ampere
GEMM_PRESET=medium

# Custom GEMM Parameters (override preset)
# BLOCK_M=128
# BLOCK_N=128
# BLOCK_K=8
# THREAD_M=8
# THREAD_N=8
# USE_DOUBLE_BUFFER=true
# USE_VECTORIZED_LOAD=true

# Logging
LOG_LEVEL=INFO  # TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
LOG_FILE=       # Empty = console only
LOG_COLORS=true

# Benchmark Settings
BENCHMARK_WARMUP_ITERS=5
BENCHMARK_BENCH_ITERS=20

# Memory Pool
MEMORY_POOL_ENABLED=true
MEMORY_POOL_ALIGNMENT=256

# Quantization
QUANTIZATION_ENABLED=false
QUANTIZATION_BITS=8
QUANTIZATION_PER_CHANNEL=true
