# High Performance Configuration
# ================================
# Optimized for maximum throughput on modern GPUs

CUDA_DEVICE=0
MAX_GPU_MEMORY_MB=0

# Enable all optimizations
ENABLE_TENSOR_CORES=true
ENABLE_ASYNC_COPY=true
NUM_STREAMS=8

# Large matrix optimized settings
GEMM_PRESET=large
BLOCK_M=128
BLOCK_N=256
BLOCK_K=16
THREAD_M=8
THREAD_N=8
USE_DOUBLE_BUFFER=true
USE_VECTORIZED_LOAD=true

# Minimal logging for performance
LOG_LEVEL=WARN
LOG_COLORS=false

# Benchmark with more iterations for accuracy
BENCHMARK_WARMUP_ITERS=10
BENCHMARK_BENCH_ITERS=50

# Memory pool for reduced allocation overhead
MEMORY_POOL_ENABLED=true
MEMORY_POOL_ALIGNMENT=256
