<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0f1f0a"/>
    </linearGradient>
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76B900"/>
      <stop offset="100%" style="stop-color:#8ce600"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(118, 185, 0, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- CUDA Icon (simplified GPU chip) -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="180" height="180" rx="16" fill="#161b22" stroke="#76B900" stroke-width="3"/>
    <rect x="20" y="20" width="140" height="140" rx="8" fill="none" stroke="#76B900" stroke-width="2"/>
    <!-- Grid pattern inside chip -->
    <g stroke="#76B900" stroke-width="1" opacity="0.5">
      <line x1="55" y1="20" x2="55" y2="160"/>
      <line x1="90" y1="20" x2="90" y2="160"/>
      <line x1="125" y1="20" x2="125" y2="160"/>
      <line x1="20" y1="55" x2="160" y2="55"/>
      <line x1="20" y1="90" x2="160" y2="90"/>
      <line x1="20" y1="125" x2="160" y2="125"/>
    </g>
    <!-- NVIDIA-style green corners -->
    <rect x="25" y="25" width="30" height="30" fill="#76B900" opacity="0.8"/>
    <rect x="125" y="25" width="30" height="30" fill="#76B900" opacity="0.8"/>
    <rect x="25" y="125" width="30" height="30" fill="#76B900" opacity="0.8"/>
    <rect x="125" y="125" width="30" height="30" fill="#76B900" opacity="0.8"/>
    <rect x="75" y="75" width="30" height="30" fill="#8ce600"/>
  </g>

  <!-- Title -->
  <text x="300" y="260" font-family="Inter, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#brand-gradient)">CUDA Kernel Academy</text>

  <!-- Tagline -->
  <text x="300" y="320" font-family="Inter, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#8b949e">Systematic CUDA kernel engineering from SGEMM to inference</text>

  <!-- Feature badges -->
  <g transform="translate(300, 380)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="rgba(118, 185, 0, 0.15)" stroke="#76B900" stroke-width="1"/>
    <text x="70" y="26" font-family="monospace" font-size="16" fill="#76B900" text-anchor="middle">SGEMM</text>

    <rect x="160" y="0" width="160" height="40" rx="8" fill="rgba(118, 185, 0, 0.15)" stroke="#76B900" stroke-width="1"/>
    <text x="240" y="26" font-family="monospace" font-size="16" fill="#76B900" text-anchor="middle">Tensor Core</text>

    <rect x="340" y="0" width="180" height="40" rx="8" fill="rgba(118, 185, 0, 0.15)" stroke="#76B900" stroke-width="1"/>
    <text x="430" y="26" font-family="monospace" font-size="16" fill="#76B900" text-anchor="middle">FlashAttention</text>

    <rect x="540" y="0" width="160" height="40" rx="8" fill="rgba(118, 185, 0, 0.15)" stroke="#76B900" stroke-width="1"/>
    <text x="620" y="26" font-family="monospace" font-size="16" fill="#76B900" text-anchor="middle">Inference</text>
  </g>

  <!-- URL -->
  <text x="300" y="520" font-family="monospace" font-size="20" fill="#484f58">github.com/LessUp/cuda-kernel-academy</text>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="60" fill="#76B900" opacity="0.1"/>
  <circle cx="1150" cy="150" r="40" fill="#8ce600" opacity="0.1"/>
  <circle cx="1050" cy="550" r="80" fill="#76B900" opacity="0.05"/>
</svg>
