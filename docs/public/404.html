<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - CUDA Kernel Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 0 24px;
    }
    .error-code {
      font-size: 6rem;
      color: #76B900;
      font-weight: 800;
      line-height: 1;
    }
    .title {
      font-size: 1.5rem;
      margin: 1rem 0;
      font-weight: 600;
    }
    .desc {
      color: #8b949e;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .home-link {
      display: inline-block;
      background: #76B900;
      color: #0d1117;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .home-link:hover {
      background: #8ce600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <div class="title">Page Not Found</div>
    <p class="desc">The page you requested does not exist or has moved.</p>
    <a href="/" class="home-link">Back to CUDA Kernel Academy</a>
  </div>
</body>
</html>
