<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/>
      <stop offset="100%" style="stop-color:#5c9100"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#brandGradient)"/>
  <!-- CUDA-inspired kernel icon -->
  <g fill="#ffffff">
    <!-- Grid pattern representing parallel threads -->
    <rect x="6" y="6" width="8" height="8" rx="1" opacity="0.9"/>
    <rect x="18" y="6" width="8" height="8" rx="1" opacity="0.7"/>
    <rect x="6" y="18" width="8" height="8" rx="1" opacity="0.7"/>
    <rect x="18" y="18" width="8" height="8" rx="1" opacity="0.5"/>
    <!-- Connection lines representing shared memory -->
    <line x1="14" y1="10" x2="18" y2="10" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="10" y1="14" x2="10" y2="18" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <line x1="14" y1="22" x2="18" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="22" y1="14" x2="22" y2="18" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
