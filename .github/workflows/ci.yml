name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  docs-build:
    name: Docs and Pages Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build-prod

      - name: Verify build artifacts
        run: |
          test -f _site/index.html || exit 1
          test -f _site/sitemap.xml || exit 1
          test -f _site/robots.txt || exit 1
          test -f _site/404.html || exit 1
          test -f _site/assets/styles/website.css || exit 1

  cuda-build-smoke:
    name: CUDA Build Smoke (CPU-only runner, no GPU tests)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.2.2-devel-ubuntu22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build g++ git ca-certificates

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF

      - name: Build every module
        run: cmake --build build/ci -j 2

      - name: List tests (run requires a GPU)
        run: ctest --test-dir build/ci -N

  cmake-presets:
    name: CMake Preset Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.2

      - name: List presets
        run: cmake --list-presets
