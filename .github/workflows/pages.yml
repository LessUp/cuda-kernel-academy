name: Deploy Docs

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "01-sgemm-tutorial/README.md"
      - "02-tensorcraft-core/README.md"
      - "02-tensorcraft-core/docs/**"
      - "03-hpc-advanced/README.md"
      - "03-hpc-advanced/docs/**"
      - "04-inference-engine/README.md"
      - "04-inference-engine/docs/**"
      - "examples/README.md"
      - "README.md"
      - "README.zh-CN.md"
      - "SUMMARY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "book.json"
      - ".gitbook.yaml"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            01-sgemm-tutorial/README.md
            02-tensorcraft-core/README.md
            02-tensorcraft-core/docs
            03-hpc-advanced/README.md
            03-hpc-advanced/docs
            04-inference-engine/README.md
            04-inference-engine/docs
            examples/README.md
            README.md
            README.zh-CN.md
            SUMMARY.md
            CHANGELOG.md
            CONTRIBUTING.md
            book.json
            .gitbook.yaml
            package.json
            package-lock.json
            assets
            scripts

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache HonKit plugins
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Post-build optimization
        run: npm run post-build

      - name: Verify build
        run: |
          echo "Build contents:"
          ls -la _site/
          echo ""
          echo "Checking for sitemap.xml:"
          test -f _site/sitemap.xml && echo "✓ sitemap.xml exists" || echo "✗ sitemap.xml missing"
          echo ""
          echo "Checking for robots.txt:"
          test -f _site/robots.txt && echo "✓ robots.txt exists" || echo "✗ robots.txt missing"
          echo ""
          echo "Checking for 404.html:"
          test -f _site/404.html && echo "✓ 404.html exists" || echo "✗ 404.html missing"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
