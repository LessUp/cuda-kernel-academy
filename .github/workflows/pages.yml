name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "01-sgemm-tutorial/README.md"
      - "02-tensorcraft-core/README.md"
      - "02-tensorcraft-core/docs/**"
      - "03-hpc-advanced/README.md"
      - "03-hpc-advanced/docs/**"
      - "04-inference-engine/README.md"
      - "04-inference-engine/docs/**"
      - "examples/README.md"
      - "README.md"
      - "README.zh-CN.md"
      - "SUMMARY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "book.json"
      - ".gitbook.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            01-sgemm-tutorial/README.md
            02-tensorcraft-core/README.md
            02-tensorcraft-core/docs
            03-hpc-advanced/README.md
            03-hpc-advanced/docs
            04-inference-engine/README.md
            04-inference-engine/docs
            examples/README.md
            README.md
            README.zh-CN.md
            SUMMARY.md
            CHANGELOG.md
            CONTRIBUTING.md
            book.json
            .gitbook.yaml
            package.json
            package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install honkit
        run: npm ci

      - name: Build docs
        run: npx honkit build . _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
