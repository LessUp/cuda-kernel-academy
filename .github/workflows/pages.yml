name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "01-sgemm-tutorial/README.md"
      - "02-tensorcraft-core/README.md"
      - "02-tensorcraft-core/docs/**"
      - "03-hpc-advanced/README.md"
      - "03-hpc-advanced/docs/**"
      - "04-inference-engine/README.md"
      - "04-inference-engine/docs/**"
      - "examples/README.md"
      - "README.md"
      - "SUMMARY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "book.json"
      - ".gitbook.yaml"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - "scripts/post-build.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build-prod

      - name: Verify build
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/404.html
          test -f _site/assets/styles/website.css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
