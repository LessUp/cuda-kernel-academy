name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.md"
      - "README.zh-CN.md"
      - "01-sgemm-tutorial/README.md"
      - "02-tensorcraft-core/**"
      - "03-hpc-advanced/**"
      - "04-inference-engine/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Copy static 404 page
        working-directory: docs
        run: cp public/404.html .vitepress/dist/404.html

      - name: Verify build
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
